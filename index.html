const app=document.getElementById('app');
const all=sections.flatMap((s,i)=>s.questions.map(q=>({...q,section:i})));
let seen={},scope=[],round=[],pos=0,answers=[],limit=5,scopeName='',lecture=0;try{seen=JSON.parse(localStorage.getItem('bio-exam-v1')||'{}')}catch(e){}

function save(){try{localStorage.setItem('bio-exam-v1',JSON.stringify(seen))}catch(e){}}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function btn(t,action,cls=''){return `<button class="${cls}" onclick="${action}">${t}</button>`}

function home(){app.innerHTML=`<div class="panel"><h2>عايز تمتحن على إيه؟</h2><p class="muted">${all.length} سؤال • ${sections.length} موضوع • تمت الإجابة على ${Object.keys(seen).length} سؤال مختلف</p>${btn('المحاضرة الأولى — Amino Acids & Proteins','choose(1)')}${btn('المحاضرة الثانية — Enzymes','choose(2)')}${btn('امتحان شامل — 10 أسئلة','selectScope(0,-1)','primary')}</div><div class="panel"><details><summary>ملاحظات مهمة عن المحاضرات</summary><p>الأسئلة تتبع صياغة المحاضرات. المحاضرة الأولى تذكر 10 أحماض أساسية مع الأرجينين، بينما توضح أن البالغين يحتاجون 9 والأرجينين شرطي. توجد اختلافات في تصنيف الأحماض الكبريتية بين النص والرسم، لذلك لا نستخدمها كسؤال تصنيف ملتبس. بعض أمثلة المحاضرة الثانية مبسطة علميًا؛ الأسئلة الموسومة according to the lecture تتبع المقرر.</p></details>${btn('مسح سجل الأسئلة السابقة','resetSeen()')}</div>`}

function resetSeen(){if(confirm('تمسح سجل التدريب؟')){seen={};save();home()}}

function choose(l){lecture=l;app.innerHTML=`<div class="panel"><h2>المحاضرة ${l===1?'الأولى':'الثانية'}</h2>${btn('امتحان المحاضرة كاملة — 5 أسئلة','selectScope('+l+',-1)','primary')}<h2>أو اختار موضوع محدد</h2>${sections.map((s,i)=>s.lecture===l?btn(`<span dir="ltr">${esc(s.title)}</span><br><small>${l===1?'صفحات':'شرائح'} ${s.page} • ${s.questions.length} سؤال • ${s.questions.filter(q=>seen[q.id]).length} تمت مراجعتها</small>`,`selectScope(${l},${i})`):'').join('')}${btn('القائمة الرئيسية','home()')}</div>`}

function selectScope(l,i){lecture=l;scope=all.filter(q=>i>=0?q.section===i:l===0||sections[q.section].lecture===l);limit=l===0?10:5;scopeName=i>=0?sections[i].title:l===0?'Comprehensive Exam':`Lecture ${l} — Full exam`;start('fresh')}

function start(mode){let previous=round.map(q=>q.id);let pool=mode==='same'?round:mode==='fresh'?scope.filter(q=>!seen[q.id]):scope;if(mode==='fresh'&&!pool.length){app.innerHTML=`<div class="panel"><h2>خلصت كل الأسئلة الجديدة في الجزء ده!</h2>${btn('امتحان عشوائي','start(\'random\')','primary')}${btn('إعادة نفس الأسئلة','start(\'same\')')}${btn('القائمة الرئيسية','home()')}</div>`;return}if(mode==='same'&&!pool.length)pool=scope;let n=mode==='same'?pool.length:Math.min(limit,pool.length);if(lecture===0&&mode!=='same'&&n===10){let a=shuffle(pool.filter(q=>sections[q.section].lecture===1)).slice(0,5),b=shuffle(pool.filter(q=>sections[q.section].lecture===2)).slice(0,5);let picked=[...a,...b];round=shuffle([...picked,...shuffle(pool.filter(q=>!picked.includes(q))).slice(0,10-picked.length)])}else round=mode==='same'?[...pool]:shuffle(pool).slice(0,n);pos=0;answers=[];show()}

function show(){let q=round[pos],s=sections[q.section];let options=shuffle(q.a);app.innerHTML=`<div class="panel"><div class="stats"><span class="tag">${esc(scopeName)}</span><span>${pos+1} / ${round.length}</span></div><div class="bar"><i style="width:${100*pos/round.length}%"></i></div><p class="muted" dir="ltr">Lecture ${s.lecture} • ${s.lecture===1?'Page':'Slide'} ${s.page} • ${esc(s.title)}</p><h2 class="en">${esc(q.q)}</h2><div id="opts">${options.map((a,i)=>`<button class="answer" data-index="${q.a.indexOf(a)}" onclick="answer(this)">${'ABCD'[i]}. ${esc(a)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div>${btn('خروج للقائمة الرئيسية','leave()')}</div>`}

function leave(){if(confirm('تخرج من الامتحان الحالي؟'))home()}

function answer(el){if(answers.length>pos)return;let q=round[pos],idx=Number(el.dataset.index),ok=idx===0;answers.push({q,idx,ok});seen[q.id]=(seen[q.id]||0)+1;save();document.querySelectorAll('#opts button').forEach(b=>{b.disabled=true;if(b.dataset.index==='0')b.classList.add('correct');else if(b===el)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="panel ${ok?'correct':'wrong'}"><strong>${ok?'إجابة صحيحة ✓':'إجابة غلط ✗'}</strong><p class="en">Correct answer: ${esc(q.a[0])}</p></div>${btn(pos+1===round.length?'عرض النتيجة':'السؤال التالي','next()','primary')}`}

function next(){if(answers.length<=pos)return;pos++;if(pos===round.length)result();else show()}

function result(){let score=answers.filter(a=>a.ok).length,remaining=scope.filter(q=>!seen[q.id]).length;app.innerHTML=`<div class="panel"><h2>نتيجة الامتحان</h2><div class="score">${score} / ${round.length}</div><p style="text-align:center">${Math.round(score/round.length*100)}% • ${remaining} سؤال جديد متبقي في النطاق</p>${btn('إعادة نفس الأسئلة','start(\'same\')','primary')}${btn('أسئلة جديدة لم تظهر من قبل ('+remaining+')','start(\'fresh\')')}${btn('أسئلة عشوائية — ممكن تتكرر','start(\'random\')')}${btn('اختيار موضوع آخر',lecture?'choose('+lecture+')':'home()')}${btn('القائمة الرئيسية','home()')}</div><div class="panel"><h2>مراجعة الإجابات</h2>${answers.map(a=>`<div class="en"><strong>${a.ok?'✓':'✗'} ${esc(a.q.q)}</strong><p>Your answer: ${esc(a.q.a[a.idx])}<br>Correct: ${esc(a.q.a[0])}</p></div>`).join('<hr>')}</div>`}home();
  </script>
 </body>
</html>
